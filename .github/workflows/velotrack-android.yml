name: velotrack-android

on:
  push:
    branches: [main]
    paths:
      - "velotrack/**"
      # Documentation and store assets must not burn a version code or cut a release.
      - "!velotrack/**.md"
      - "!velotrack/store/**"
      - "!velotrack/docs/**"
      - ".github/workflows/velotrack-android.yml"
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload and pushing the velotrack-latest tag

# One publish at a time so two pushes cannot race on the velotrack-latest tag.
concurrency:
  group: velotrack-android
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1" # installed on PATH; the repo has no Gradle wrapper

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build map assets (style, glyphs, sprites)
        working-directory: velotrack
        run: tools/build-assets.sh

      - name: Decode the release signing key
        # The PKCS12 keystore lives only in repository secrets (base64); forks and pull requests
        # without the secret build a debug-signed APK instead.
        env:
          KEYSTORE_B64: ${{ secrets.VELOTRACK_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/velotrack-release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/velotrack-release.p12" >> "$GITHUB_ENV"
            echo "Release key decoded ($(stat -c %s "$RUNNER_TEMP/velotrack-release.p12") bytes)"
          else
            echo "::warning::VELOTRACK_KEYSTORE_B64 secret not set: the APK will carry the debug signature"
          fi

      - name: Unit tests and release APK
        working-directory: velotrack
        env:
          KEYSTORE_PASSWORD: ${{ secrets.VELOTRACK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VELOTRACK_KEY_ALIAS }}
        run: gradle --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Assert network permissions and the MapLibre offline guard
        run: |
          set -euo pipefail
          MANIFEST="$(find velotrack/app/build/intermediates/merged_manifests/release -type f -name AndroidManifest.xml | head -n 1 || true)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged release manifest not found under velotrack/app/build/intermediates/merged_manifests/release"
            find velotrack/app/build/intermediates -name AndroidManifest.xml -type f || true
            exit 1
          fi
          echo "Merged manifest: $MANIFEST"
          echo "Permissions in the merged manifest:"
          grep -o 'android:name="android\.permission\.[A-Z_]*"' "$MANIFEST" | sort -u || echo "(none found)"

          # The in-app map download needs INTERNET; nothing else may use the network.
          if ! grep -q '"android.permission.INTERNET"' "$MANIFEST"; then
            echo "::error::android.permission.INTERNET is missing from the merged manifest (map download would fail)"
            exit 1
          fi
          echo "OK: INTERNET permission present (used only by the map download service)"

          if grep -q '"android.permission.ACCESS_WIFI_STATE"' "$MANIFEST"; then
            echo "::error::android.permission.ACCESS_WIFI_STATE is present in the merged manifest (tools:node=\"remove\" missing?)"
            exit 1
          fi
          echo "OK: no ACCESS_WIFI_STATE permission"

          # MapLibre must stay offline: only the Download screen may touch the network.
          APP_CLASS="velotrack/app/src/main/java/com/fablab503/velotrack/VeloTrackApp.kt"
          if ! grep -q 'MapLibre.setConnected(false)' "$APP_CLASS"; then
            echo "::error::$APP_CLASS does not call MapLibre.setConnected(false); the map renderer could fetch tiles online"
            exit 1
          fi
          echo "OK: MapLibre.setConnected(false) found in $APP_CLASS"

      - name: Upload APK and bundle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: velotrack-apk
          path: |
            velotrack/app/build/outputs/apk/release/*.apk
            velotrack/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: velotrack-test-reports
          path: velotrack/app/build/reports/tests
          if-no-files-found: ignore

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls velotrack/app/build/outputs/apk/release/*.apk | head -n 1)"
          AAB="$(ls velotrack/app/build/outputs/bundle/release/*.aab | head -n 1)"
          echo "APK: $APK ($(stat -c %s "$APK") bytes); AAB: $AAB ($(stat -c %s "$AAB") bytes)"

          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          VERSIONED_TAG="velotrack-v${GITHUB_RUN_NUMBER}"
          VERSIONED_APK="velotrack-v${GITHUB_RUN_NUMBER}.apk"
          VERSIONED_AAB="velotrack-v${GITHUB_RUN_NUMBER}.aab"
          LATEST_TAG="velotrack-latest"
          LATEST_APK="velotrack-latest.apk"
          LATEST_AAB="velotrack-latest.aab"
          cp "$APK" "$VERSIONED_APK"
          cp "$APK" "$LATEST_APK"
          cp "$AAB" "$VERSIONED_AAB"
          cp "$AAB" "$LATEST_AAB"

          SUBJECT="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "VeloTrack ${VERSION} (build ${GITHUB_RUN_NUMBER})"
            echo
            echo "- Commit: ${GITHUB_SHA} - ${SUBJECT}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Install: open the .apk on the phone and allow installing from your browser when asked."
            echo "The stable download link for the newest build is the velotrack-latest pre-release."
          } > "$NOTES"

          # Immutable release for this run number.
          if gh release view "$VERSIONED_TAG" >/dev/null 2>&1; then
            echo "Release $VERSIONED_TAG exists (re-run); replacing its APK"
            gh release upload "$VERSIONED_TAG" "$VERSIONED_APK" "$VERSIONED_AAB" --clobber
          else
            gh release create "$VERSIONED_TAG" "$VERSIONED_APK" "$VERSIONED_AAB" \
              --target "$GITHUB_SHA" \
              --title "VeloTrack ${VERSION}" \
              --notes-file "$NOTES"
          fi

          # Rolling pre-release: move the tag to this commit, then replace the asset.
          git tag -f "$LATEST_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$LATEST_TAG"
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release upload "$LATEST_TAG" "$LATEST_APK" "$LATEST_AAB" --clobber
            gh release edit "$LATEST_TAG" --prerelease --title "VeloTrack latest" --notes-file "$NOTES"
          else
            gh release create "$LATEST_TAG" "$LATEST_APK" "$LATEST_AAB" \
              --prerelease \
              --title "VeloTrack latest" \
              --notes-file "$NOTES"
          fi

          {
            echo "## VeloTrack ${VERSION}"
            echo
            echo "- Latest APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_APK}"
            echo "- Latest bundle (Play Store upload): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_AAB}"
            echo "- This build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSIONED_TAG}"
            echo "- Size: $(stat -c %s "$APK") bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Do we have Google Play credentials?
        id: playcreds
        # A step-level "if" cannot read the secrets context, so the answer becomes an output.
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -n "${PLAY_JSON:-}" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "Play service account present: this build goes straight to the testers"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No PLAY_SERVICE_ACCOUNT_JSON secret: skipping the Google Play upload (see velotrack/store/PLAY_STORE.md)"
          fi

      - name: Release notes for Google Play
        if: steps.playcreds.outputs.have == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whatsnew"
          # Play rejects release notes longer than 500 characters.
          {
            echo "Build ${GITHUB_RUN_NUMBER}: $(git log -1 --pretty=%s "$GITHUB_SHA")"
          } | cut -c 1-480 > "$RUNNER_TEMP/whatsnew/whatsnew-en-GB"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-en-GB"

      # Internal testing takes an upload immediately, with no review, so this is the track that
      # keeps up with a day of rapid changes. Testers on it get the update through Google Play
      # within minutes and never sideload anything.
      - name: Send the build to the internal testers
        if: steps.playcreds.outputs.have == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fablab503.velotrack
          releaseFiles: velotrack/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # The twelve testers Google requires before production live on the closed track, so they get
      # the build too. This one is allowed to fail: the track only exists once a closed test has
      # been created, and a missing track must never turn a good build red.
      - name: Send the build to the closed testers as well
        id: closedupload
        continue-on-error: true
        if: steps.playcreds.outputs.have == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.fablab503.velotrack
          releaseFiles: velotrack/app/build/outputs/bundle/release/*.aab
          track: alpha
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Say where the build went
        if: steps.playcreds.outputs.have == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          {
            echo "### Sent to testers"
            echo
            echo "- Internal testing: build ${GITHUB_RUN_NUMBER} is live."
            if [ "${{ steps.closedupload.outcome }}" = "success" ]; then
              echo "- Closed testing (alpha): build ${GITHUB_RUN_NUMBER} is live."
            else
              echo "- Closed testing (alpha): skipped. Create the closed track, or check its id is 'alpha'."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
