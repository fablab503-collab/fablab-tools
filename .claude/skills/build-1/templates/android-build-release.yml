name: velotrack-android

on:
  push:
    branches: [main]
    paths:
      - "velotrack/**"
      - ".github/workflows/velotrack-android.yml"
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload and pushing the velotrack-latest tag

# One publish at a time so two pushes cannot race on the velotrack-latest tag.
concurrency:
  group: velotrack-android
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.7.1" # installed on PATH; the repo has no Gradle wrapper

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build map assets (style, glyphs, sprites)
        working-directory: velotrack
        run: tools/build-assets.sh

      - name: Unit tests and release APK
        working-directory: velotrack
        run: gradle --no-daemon testDebugUnitTest assembleRelease

      - name: Assert the merged manifest has no INTERNET permission
        run: |
          set -euo pipefail
          MANIFEST="$(find velotrack/app/build/intermediates/merged_manifests/release -type f -name AndroidManifest.xml | head -n 1 || true)"
          if [ -z "$MANIFEST" ]; then
            echo "::error::Merged release manifest not found under velotrack/app/build/intermediates/merged_manifests/release"
            find velotrack/app/build/intermediates -name AndroidManifest.xml -type f || true
            exit 1
          fi
          echo "Merged manifest: $MANIFEST"
          echo "Permissions in the merged manifest:"
          grep -o 'android:name="android\.permission\.[A-Z_]*"' "$MANIFEST" | sort -u || echo "(none found)"
          if grep -q '"android.permission.INTERNET"' "$MANIFEST"; then
            echo "::error::android.permission.INTERNET is present in the merged manifest (tools:node=\"remove\" missing?)"
            exit 1
          fi
          echo "OK: no INTERNET permission"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: velotrack-apk
          path: velotrack/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: velotrack-test-reports
          path: velotrack/app/build/reports/tests
          if-no-files-found: ignore

      - name: Publish to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls velotrack/app/build/outputs/apk/release/*.apk | head -n 1)"
          echo "APK: $APK ($(stat -c %s "$APK") bytes)"

          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          VERSIONED_TAG="velotrack-v${GITHUB_RUN_NUMBER}"
          VERSIONED_APK="velotrack-v${GITHUB_RUN_NUMBER}.apk"
          LATEST_TAG="velotrack-latest"
          LATEST_APK="velotrack-latest.apk"
          cp "$APK" "$VERSIONED_APK"
          cp "$APK" "$LATEST_APK"

          SUBJECT="$(git log -1 --pretty=%s "$GITHUB_SHA")"
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "VeloTrack ${VERSION} (build ${GITHUB_RUN_NUMBER})"
            echo
            echo "- Commit: ${GITHUB_SHA} - ${SUBJECT}"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Install: open the .apk on the phone and allow installing from your browser when asked."
            echo "The stable download link for the newest build is the velotrack-latest pre-release."
          } > "$NOTES"

          # Immutable release for this run number.
          if gh release view "$VERSIONED_TAG" >/dev/null 2>&1; then
            echo "Release $VERSIONED_TAG exists (re-run); replacing its APK"
            gh release upload "$VERSIONED_TAG" "$VERSIONED_APK" --clobber
          else
            gh release create "$VERSIONED_TAG" "$VERSIONED_APK" \
              --target "$GITHUB_SHA" \
              --title "VeloTrack ${VERSION}" \
              --notes-file "$NOTES"
          fi

          # Rolling pre-release: move the tag to this commit, then replace the asset.
          git tag -f "$LATEST_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$LATEST_TAG"
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            gh release upload "$LATEST_TAG" "$LATEST_APK" --clobber
            gh release edit "$LATEST_TAG" --prerelease --title "VeloTrack latest" --notes-file "$NOTES"
          else
            gh release create "$LATEST_TAG" "$LATEST_APK" \
              --prerelease \
              --title "VeloTrack latest" \
              --notes-file "$NOTES"
          fi

          {
            echo "## VeloTrack ${VERSION}"
            echo
            echo "- Latest APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${LATEST_TAG}/${LATEST_APK}"
            echo "- This build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSIONED_TAG}"
            echo "- Size: $(stat -c %s "$APK") bytes"
          } >> "$GITHUB_STEP_SUMMARY"
