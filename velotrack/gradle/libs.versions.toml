[versions]
agp = "9.4.0"
# core 1.19.0 declares minCompileSdk=37 in its AAR metadata and fails checkReleaseAarMetadata
# against compileSdk 36; 1.18.0 (minCompileSdk=36) is the newest core compatible with the plan's
# compileSdk 36 and is what activity 1.13.0 already pulls transitively.
coreKtx = "1.18.0"
appcompat = "1.8.0"
material = "1.14.0"
activity = "1.13.0"
lifecycle = "2.11.0"
preference = "1.2.1"
constraintlayout = "2.2.2"
coroutines = "1.11.0"
maplibre = "13.6.0"
# Same artifact and version MapLibre 13.6.0 pulls at runtime; declared explicitly so the download
# module can compile against it (MapLibre only exposes OkHttp at runtime scope).
okhttp = "4.12.0"
junit = "4.13.2"
# Wear OS companion: the Data Layer (DataClient/MessageClient) lives in play-services-wearable,
# and androidx.wear supplies BoxInsetLayout, which keeps content inside a round screen.
playServicesWearable = "18.2.0"
wear = "1.3.0"
# await() on a Play Services Task; the Data Layer only offers Task-based APIs.
coroutinesPlayServices = "1.11.0"
# OngoingActivity: how a Wear app stays visible on the watch face during a ride. Play's Wear
# quality rules require it for a workout-style app, and it is what stops the watch dropping
# back to the watch face mid-ride.
wearOngoing = "1.1.0"
# Instrumented tests: the only way to exercise the Data Layer, which needs a real device/emulator
# and Play Services. Unit tests on the JVM cannot reach it.
androidxTestJunit = "1.2.1"
androidxTestRunner = "1.6.2"
androidxTestCore = "1.6.1"
# Real org.json for unit tests: the Android SDK jar these tests otherwise compile and run against
# only stubs org.json (every method body throws or, with isReturnDefaultValues, silently returns
# null/0), which cannot exercise real parsing. Same artifact org.json ships inside the platform.
json = "20240303"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activity" }
androidx-lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
maplibre-opengl = { module = "org.maplibre.gl:android-sdk-opengl", version.ref = "maplibre" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
androidx-wear = { module = "androidx.wear:wear", version.ref = "wear" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
androidx-wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-core = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
