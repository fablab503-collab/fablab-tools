[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-dub"
version = "0.2.0"
description = "Dub your videos into other languages in your own voice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "soundfile",
    "faster-whisper>=1.1",
    "demucs>=4.1",
    "anthropic>=1.8",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# The two voice engines pin different versions of torch and transformers, so each goes in
# its own virtual environment: pip install -e ".[chatterbox]"  or  pip install -e ".[xtts]"
chatterbox = ["chatterbox-tts>=0.1.7"]
xtts = ["coqui-tts>=0.27"]
argos = ["argostranslate>=1.9"]
# The Mac app installs one of these. Apple Silicon: Chatterbox on the GPU and Whisper through
# MLX. Intel Macs: PyTorch stops at 2.2 there, too old for Chatterbox, so the voice is XTTS
# on the processor, with transformers kept below 5 (which needs PyTorch 2.4).
apple = ["chatterbox-tts>=0.1.7", "mlx-whisper>=0.4"]
intel-mac = ["coqui-tts>=0.27", "torch==2.2.2", "torchaudio==2.2.2", "numpy<2", "transformers>=4.57,<5"]
test = ["pytest"]

[project.scripts]
eco = "eco.cli:main"

[tool.setuptools]
packages = ["eco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
