[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eco-dub"
version = "0.1.0"
description = "Dub your videos into other languages in your own voice"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "soundfile",
    "faster-whisper>=1.1",
    "demucs>=4.1",
    "anthropic>=1.8",
]

[project.optional-dependencies]
# The two voice engines pin different versions of torch and transformers, so each goes in
# its own virtual environment: pip install -e ".[chatterbox]"  or  pip install -e ".[xtts]"
chatterbox = ["chatterbox-tts>=0.1.7"]
xtts = ["coqui-tts>=0.27"]
argos = ["argostranslate>=1.9"]
test = ["pytest"]

[project.scripts]
eco = "eco.cli:main"

[tool.setuptools]
packages = ["eco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
